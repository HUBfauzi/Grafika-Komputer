<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Canvas Acak Map</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
    /* Membungkus SVG agar bisa di-scroll jika petanya kebesaran */
    .map-container {
      width: 800px;
      height: 500px;
      overflow: auto; /* Fitur scroll */
      border: 3px solid #333;
      margin: 20px auto;
      background-color: #f0f8ff;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #6a1b9a;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background-color: #4a148c; }
  </style>
</head>
<body>

  <h2>Simulasi Generate Tata Kota AI</h2>
  
  <button onclick="buatPetaAcak()">🎲 Acak Peta Sekarang</button>

  <div class="map-container">
    <svg id="canvasPeta" width="1500" height="1000"></svg>
  </div>

  <script>
    function buatPetaAcak() {
      const svg = document.getElementById("canvasPeta");
      // 1. Kosongkan kanvas dari peta sebelumnya
      svg.innerHTML = ""; 

      const jumlahKota = Math.floor(Math.random() * 5) + 5; // Acak 5 sampai 9 kota
      const posisiKota = [];

      // 2. Generate koordinat X dan Y secara acak untuk setiap kota
      for (let i = 0; i < jumlahKota; i++) {
        posisiKota.push({
          x: Math.random() * 1300 + 100, // X antara 100 - 1400
          y: Math.random() * 800 + 100,  // Y antara 100 - 900
          nama: "Titik " + (i + 1)
        });
      }

      let elemenGrafis = "";

      // 3. Tarik garis jalan (Di sini kita hubungkan secara berurutan agar tidak terisolasi)
      for (let i = 0; i < posisiKota.length - 1; i++) {
        let asal = posisiKota[i];
        let tujuan = posisiKota[i+1];
        
        // Membuat jalan melengkung sederhana dengan Quadratic Bezier Curve (Q)
        let titikTarikX = (asal.x + tujuan.x) / 2 + (Math.random() * 200 - 100);
        let titikTarikY = (asal.y + tujuan.y) / 2 + (Math.random() * 200 - 100);
        
        elemenGrafis += `<path d="M ${asal.x} ${asal.y} Q ${titikTarikX} ${titikTarikY} ${tujuan.x} ${tujuan.y}" 
                               stroke="#555" stroke-width="8" fill="none" />`;
      }

      // 4. Gambar lingkaran untuk tiap persimpangan kota
      posisiKota.forEach(kota => {
        elemenGrafis += `<circle cx="${kota.x}" cy="${kota.y}" r="15" fill="white" stroke="#1565c0" stroke-width="4" />`;
        elemenGrafis += `<text x="${kota.x}" y="${kota.y + 5}" font-size="12" font-weight="bold" text-anchor="middle">${kota.nama}</text>`;
      });

      // 5. Tampilkan ke dalam kanvas SVG
      svg.innerHTML = elemenGrafis;
    }

    // Jalankan sekali saat pertama kali halaman dibuka
    buatPetaAcak();
  </script>
</body>
</html>
